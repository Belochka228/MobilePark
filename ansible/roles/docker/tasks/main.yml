---
- name: Install dependencies for Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker fixed version
  apt:
    name:
      - "docker-ce={{ docker_version }}"
      - "docker-ce-cli={{ docker_version }}"
      - containerd.io
    state: present
    update_cache: true

- name: Add admin users to docker group
  user:
    name: "{{ item.name }}"
    groups: docker
    append: true
  loop: "{{ admin_users }}"

- name: Add technical users to docker group
  user:
    name: "{{ item.name }}"
    groups: docker
    append: true
  loop: "{{ technical_users }}"

- name: Enable and start Docker service
  service:
    name: docker
    state: started
    enabled: true